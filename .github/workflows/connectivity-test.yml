name: Connectivity test (throwaway)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Runner region / IP
        run: curl -s https://ipinfo.io/json || true
      - name: Binance public API reachability
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" https://api.binance.com/api/v3/ping
          curl -s https://api.binance.com/api/v3/ping
          echo ""
          curl -s https://api.binance.com/api/v3/klines?symbol=BTCUSDT\&interval=5m\&limit=1
