events {}

http {
    # Docker's embedded DNS. Resolving at request time (via the $upstream variable below)
    # rather than once at config load means nginx picks up the dashboard container's new
    # IP automatically if it's ever recreated, instead of needing a manual nginx restart.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        listen [::]:80;
        server_name patternpulse.*;

        location / {
            set $upstream http://dashboard:8501;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }
    }
}
